# Netlify deploy — static Vite app + serverless API bridges + push cron
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Proxy API
[[redirects]]
  from = "/ffvb-api/*"
  to = "/.netlify/functions/ffvb?path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ffvolley-api/*"
  to = "/.netlify/functions/ffvolley?path=:splat"
  status = 200
  force = true

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Background push dispatcher — every 10 minutes
[functions."push-dispatch"]
  schedule = "*/10 * * * *"
